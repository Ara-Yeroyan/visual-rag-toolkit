name: Sync to HuggingFace Space

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://Yeroyan:${HF_TOKEN}@huggingface.co/spaces/Yeroyan/visual-rag-toolkit || true
          git push hf main --force
